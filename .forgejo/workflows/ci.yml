name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Syntax check the executable
        run: node --check bin/vbcdx-dev-agents.js

      - name: Assert role descriptors are in sync with the capability table
        run: |
          node scripts/derive-roles.mjs
          if ! git diff --quiet -- assets/roles; then
            echo "role.json descriptors are out of sync with scripts/derive-roles.mjs; regenerate and commit."
            git --no-pager diff --stat -- assets/roles
            exit 1
          fi

      - name: Run tests
        run: npm test
